.world-map .country.visited,
.world-map .country.visited:hover,
.world-map .country.visited.selected,
.world-map .hk-marker.visited,
.world-map .hk-marker.visited:hover {
  fill:#607a68!important;
}
.world-map .country:not(.visited) {pointer-events:none;cursor:default}

/* Strong, consistent hover/focus feedback for visited countries */
.world-map svg {overflow:visible}
.world-map .country.visited {transition:filter .16s ease,stroke-width .16s ease;cursor:pointer}
.world-map .country.visited:hover,.world-map .country.visited:focus-visible {fill:#607a68!important;stroke:#152e22!important;stroke-width:2.8px!important;filter:brightness(1.35) drop-shadow(0px 1px 3px rgba(0,0,0,.5));outline:none}

/* Responsive homepage: use available screen space rather than a fixed map size. */
@media (min-width: 901px) {
  #app { min-height: 100dvh; display: flex; flex-direction: column; }
  .nav { flex: 0 0 auto; height: clamp(58px, 6.5dvh, 94px); padding-inline: clamp(28px, 4vw, 130px); }

/* Homepage: one screen tall, responsive at every resolution. */
html,body{width:100%;height:100%;overflow:hidden}
#app{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.nav{position:relative;top:auto;flex:0 0 auto;height:clamp(52px,7dvh,92px)}
.map-section{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:clamp(10px,2dvh,30px) clamp(16px,3.5vw,140px) clamp(5px,1dvh,16px)}
.map-head{flex:0 0 auto;margin-bottom:clamp(6px,1.5dvh,20px);gap:16px}
.map-head h2{font-size:clamp(28px,4.5dvh,78px)}
.map-head p{font-size:clamp(11px,1.3dvh,18px);line-height:1.4}
.world-map{flex:1 1 0;min-height:0;height:0;max-height:none;aspect-ratio:auto;overflow:hidden!important}
.world-map svg{width:100%;height:100%;min-width:0!important;display:block}
.map-note{flex:0 0 auto;margin-top:clamp(4px,.8dvh,12px);font-size:clamp(9px,1dvh,13px)}
.footer{flex:0 0 auto;padding:clamp(8px,1.3dvh,20px) clamp(16px,3.5vw,140px)}
@media(max-width:700px){
 .nav{height:clamp(52px,9dvh,70px);padding:0 16px}
 .brand{font-size:clamp(17px,3vw,22px)}
 .brand-subtitle{display:inline;margin-left:6px;font-size:clamp(9px,2vw,12px)}
 .map-section{padding:clamp(10px,2dvh,20px) 14px 6px}
 .map-head{display:block;margin-bottom:8px}
 .map-head h2{font-size:clamp(27px,5dvh,42px);margin:0 0 7px}
 .map-head p{font-size:12px;line-height:1.35}
 .world-map{aspect-ratio:auto;overflow:hidden!important}
 .world-map svg{min-width:0!important}
 .map-note{display:flex;gap:8px;font-size:9px;line-height:1.25;margin-top:6px}
 .footer{padding:9px 14px;font-size:10px}
}
@media(max-height:500px){.map-head p,.map-note{display:none}.map-head{margin-bottom:3px}.map-head h2{font-size:24px}.nav{height:42px}.footer{padding-block:5px}}

/* About Me navigation: compact enough to preserve the one-screen homepage. */
.about-link{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:clamp(17px,1.15vw,22px);letter-spacing:.04em;white-space:nowrap}
.about-link:hover{text-decoration:underline;text-underline-offset:4px}
.avatar{display:inline-grid;place-items:center;width:clamp(46px,6.5dvh,76px);height:clamp(46px,6.5dvh,76px);border-radius:50%;overflow:hidden;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:Georgia,serif;font-size:16px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:440px){.about-link{gap:6px;font-size:15px}.avatar{width:44px;height:44px}.brand-subtitle{display:none}}
/* Subtle map zoom controls */
.world-map{position:relative;overflow:hidden!important}
.map-zoom-controls{position:absolute;right:14px;bottom:14px;z-index:2;display:flex;flex-direction:column;gap:5px}
.map-zoom-controls button{width:34px;height:34px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--text);font:20px Arial,sans-serif;cursor:pointer;box-shadow:0 1px 5px #0001}
.map-zoom-controls button:hover{background:var(--bg)}
.map-zoom-controls .zoom-reset{font-size:11px;font-weight:600;letter-spacing:.03em;width:auto;padding:0 9px}
.world-map svg{touch-action:none;cursor:grab}
.world-map svg:active{cursor:grabbing}
@media(max-width:700px){.map-zoom-controls{right:8px;bottom:8px}.map-zoom-controls button{width:30px;height:30px}}
.about-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  text-decoration: none;
  font-size: clamp(17px, 1.15vw, 22px);
  letter-spacing: .04em;
  white-space: nowrap;
}

</div>
