name: Update photo galleries

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - '.github/workflows/update-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate photo lists
        run: python3 scripts/generate_galleries.py

      - name: Commit updated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add galleries/
          git diff --cached --quiet || git commit -m "Update photo galleries"
          git push
