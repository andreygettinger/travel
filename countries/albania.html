<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albania — Andrey Photography</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#181714;font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}nav{padding:25px 6%;border-bottom:1px solid #dedbd4}nav a{font-size:18px;font-weight:600;display:inline-flex;align-items:center;padding:12px 18px;border:1px solid #c9c6bd;border-radius:9px;transition:background .2s}nav a:hover{background:#e7e9df}main{max-width:1440px;margin:auto;padding:65px 6% 95px}h1{font:normal clamp(62px,11vw,135px) Georgia,serif;letter-spacing:-.06em;margin:0 0 18px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#777168;text-transform:uppercase}p{color:#777168;line-height:1.6}.map-wrap{margin:38px auto 8px;position:relative;max-width:1050px}.map-wrap svg{width:100%;height:auto;display:block;overflow:visible}.outline{fill:#607a68;stroke:#395343;stroke-width:1.25;vector-effect:non-scaling-stroke}.star{fill:#f4d57c;stroke:#273f31;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer;filter:drop-shadow(0 1px 2px #0005)}.star:hover,.star:focus{fill:#fff3b3;stroke-width:2.5;filter:drop-shadow(0 2px 5px #0008)}.star-label{font-size:13px;font-weight:600;fill:#292821;paint-order:stroke;stroke:#f5f3ef;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.hint{font-size:13px;margin:0 0 50px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:25px}.gallery img{width:100%;height:auto;display:block}.gallery-title{font:normal 34px Georgia,serif;margin-top:70px}.status{font-size:13px}footer{border-top:1px solid #dedbd4;padding:25px 6%;font-size:12px;color:#777168}

/* Match the world map's automatic light/dark appearance. */
:root{color-scheme:light dark;--page-bg:light-dark(#f5f3ef,#11110f);--page-text:light-dark(#181714,#f4f1eb);--page-muted:light-dark(#777168,#aaa59d);--page-line:light-dark(#dedbd4,#302e2a);--page-hover:light-dark(#e7e9df,#242923);--page-border:light-dark(#c9c6bd,#575d55);--map-green:light-dark(#607a68,#789784);--map-stroke:light-dark(#395343,#a3b5a6);--star-label:light-dark(#292821,#f4f1eb)}
body{background:var(--page-bg);color:var(--page-text)}
nav,footer{border-color:var(--page-line)}
nav a{border-color:var(--page-border)}nav a:hover{background:var(--page-hover)}
.eyebrow,p,footer{color:var(--page-muted)}
.outline{fill:var(--map-green);stroke:var(--map-stroke)}
.star-label{fill:var(--star-label);stroke:var(--page-bg)}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;margin-top:25px}
.gallery .photo-item{margin:0;min-width:0;overflow:hidden}
.gallery .photo-item.landscape,.gallery .photo-item.square{grid-column:1/-1}
.gallery .photo-item.portrait{grid-column:span 1}
.gallery img{display:block;width:100%;height:auto;object-fit:contain}
@media(max-width:560px){.gallery{gap:10px}}

/* Equal-width, natural-height photography columns. */
.gallery{display:block;columns:2;column-gap:18px;}
.gallery .photo-item,.gallery .photo-item.landscape,.gallery .photo-item.portrait,.gallery .photo-item.square{display:block;width:100%;break-inside:avoid;page-break-inside:avoid;margin:0 0 18px;overflow:hidden;}
.gallery img{display:block;width:100%;height:auto;object-fit:contain;}
@media(max-width:560px){.gallery{columns:1;}.gallery .photo-item{margin-bottom:12px;}}

/* Interactive place index — preserves the existing map and gallery. */
.map-places-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(245px,.75fr);align-items:center;gap:clamp(18px,3vw,56px);margin:30px 0 12px}
.map-places-layout .map-wrap{margin:0;min-width:0;max-width:none}
.place-panel{align-self:center;max-height:520px;overflow:auto;padding:8px 0 8px 20px;border-left:1px solid var(--page-line,#dedbd4);scrollbar-width:thin}
.place-panel-heading{font:normal 25px Georgia,serif;margin:0 0 8px;color:var(--page-text,#181714)}
.place-panel-subtitle{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--page-muted,#777168);margin:0 0 14px}
.place-link{display:flex;align-items:center;gap:12px;width:100%;padding:11px 9px;border-radius:7px;font-size:14px;line-height:1.35;color:var(--page-text,#181714);text-decoration:none;transition:background .15s,transform .15s}
.place-link:hover,.place-link:focus-visible,.place-link.is-active{background:var(--page-hover,#e7e9df);transform:translateX(3px);outline:none}
.place-dot{width:7px;height:7px;flex:none;border-radius:50%;background:#c9a451;box-shadow:0 0 0 3px #c9a45122}
.place-link:hover .place-dot,.place-link.is-active .place-dot{background:#f4d57c;box-shadow:0 0 0 5px #d5b35d33}
.star.is-active{fill:#fff6b6;stroke:#ae7d26;stroke-width:3;filter:drop-shadow(0 0 7px #f4d57c);}
@media(max-width:760px){.map-places-layout{grid-template-columns:1fr;gap:16px}.place-panel{max-height:none;overflow:visible;padding:0;border-left:0}.place-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px}}
@media(max-width:450px){.place-list{grid-template-columns:1fr}}

/* Consistent, compact atlas footprint on every country page. */
.map-places-layout{width:min(100%,1020px);margin:22px auto 8px;grid-template-columns:minmax(0,650px) minmax(210px,290px);justify-content:center;align-items:center;gap:clamp(18px,2.8vw,40px)}
.map-places-layout .map-wrap{width:100%;max-width:650px;margin:0 auto;display:flex;justify-content:center;align-items:center}
.map-places-layout #countryMap{display:block;width:100%;height:auto;max-height:405px;overflow:visible}
.map-places-layout .place-panel{max-height:385px}
@media(max-width:760px){.map-places-layout{width:min(100%,650px);grid-template-columns:1fr;gap:12px}.map-places-layout .map-wrap{max-width:100%}.map-places-layout #countryMap{max-height:340px}.map-places-layout .place-panel{max-height:none}}

/* Keep the visited-places list vertically scrollable, without horizontal scrolling. */
.place-panel{overflow-x:hidden;overflow-y:auto;min-width:0;max-width:100%}
.place-list,.place-link{min-width:0;max-width:100%}
.place-link{overflow-wrap:anywhere;white-space:normal}
@media(max-width:760px){.place-panel{overflow:visible}}

/* Full-width photography gallery: edge-to-edge across the browser viewport. */
.gallery-title{margin-left:0}
.gallery{
  display:block;
  width:100vw;
  max-width:none;
  position:relative;
  left:50%;
  margin-left:-50vw;
  margin-right:0;
  padding:0;
  columns:2;
  column-gap:clamp(8px,1vw,18px);
  box-sizing:border-box;
}
.gallery .photo-item,.gallery .photo-item.landscape,.gallery .photo-item.portrait,.gallery .photo-item.square{
  display:block;width:100%;max-width:none;break-inside:avoid;
  margin:0 0 clamp(8px,1vw,18px);
}
.gallery img{display:block;width:100%;max-width:none;height:auto;object-fit:contain}
@media(min-width:1800px){.gallery{columns:3}}
@media(max-width:650px){.gallery{columns:1}}

</style></head><body><nav><a href="../index.html">← World Map</a></nav><main>
<div class="eyebrow">Travel photography / Albania</div><h1>Albania.</h1>
<div class="map-places-layout"><div class="map-wrap"><svg id="countryMap" viewBox="0 0 900 590" role="img" aria-label="Map of Albania with visited locations"></svg></div><aside class="place-panel" aria-label="Visited places"><h2 class="place-panel-heading">Places I’ve been</h2><p class="place-panel-subtitle">Hover to locate · Click to explore</p><div class="place-list" id="placeList"></div></aside></div>
<p class="hint" id="mapStatus">Add your visited cities and places as stars on this map.</p>
<div class="gallery" id="gallery"></div>
<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm';
import * as topojson from 'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm';

// ADD YOUR VISITED PLACES HERE. Each needs a name, latitude and longitude.
// Example: { name: "Lima", lat: -12.0464, lon: -77.0428 },
const places = [
  {
    "name": "Tirana",
    "lat": 41.3275,
    "lon": 19.8187,
    "url": "https://www.google.com/maps/place/Tirana/data=!4m2!3m1!1s0x1350310470fac5db:0x40092af10653720"
  }
];

// Photo lists are generated automatically by GitHub Actions from photos/albania/.
// No filenames need to be entered in this HTML file.
const gallery = document.getElementById('gallery');
async function loadGallery() {
  try {
    const response = await fetch('../galleries/albania.json', {cache:'no-cache'});
    if (!response.ok) throw new Error('Photo list unavailable');
    const photos = await response.json();
    if (!Array.isArray(photos)) throw new Error('Invalid photo list');
    for (const filename of photos) {
      const img = document.createElement('img');
      img.src = '../photos/albania/' + filename.split('/').map(encodeURIComponent).join('/');
      img.alt = 'Albania — ' + filename;
      img.loading = 'lazy';
      const item = document.createElement('figure');
      item.className = 'photo-item';
      img.addEventListener('load', () => {
        const ratio = img.naturalWidth / img.naturalHeight;
        item.classList.remove('landscape', 'portrait', 'square');
        item.classList.add(ratio > 1.05 ? 'landscape' : ratio < 0.95 ? 'portrait' : 'square');
      });
      item.appendChild(img);
      gallery.appendChild(item);
    }
  } catch (error) {
    const note = document.createElement('p');
    note.textContent = 'Photos are temporarily unavailable. The gallery index may still be generating.';
    gallery.appendChild(note);
    console.warn('Gallery error:', error);
  }
}
loadGallery();

const placeList = document.getElementById('placeList');
const placeLinks = places.map((place, i) => {
  const a = document.createElement('a');
  a.className = 'place-link';
  a.href = place.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.lat + ',' + place.lon)}`;
  a.target = '_blank'; a.rel = 'noopener noreferrer';
  const dot = document.createElement('span'); dot.className = 'place-dot';
  const label = document.createElement('span'); label.textContent = place.name;
  a.append(dot, label); placeList.appendChild(a);
  a.addEventListener('mouseenter', () => setActivePlace(i, true));
  a.addEventListener('mouseleave', () => setActivePlace(i, false));
  a.addEventListener('focus', () => setActivePlace(i, true));
  a.addEventListener('blur', () => setActivePlace(i, false));
  return a;
});
const starNodes = [];
function setActivePlace(i, on) {
  if (starNodes[i]) starNodes[i].classList.toggle('is-active', on);
  if (placeLinks[i]) placeLinks[i].classList.toggle('is-active', on);
}
if (!places.length) document.querySelector('.place-panel').style.display = 'none';
const svg = d3.select('#countryMap');
try {
  const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json');
  if (!response.ok) throw new Error('Could not load map');
  const atlas = await response.json();
  const countries = topojson.feature(atlas,atlas.objects.countries).features;
  const feature = countries.find(f => String(f.id).padStart(3,'0') === '008');
  if (!feature) throw new Error('Country outline not found in map data');
  const projection = d3.geoMercator().fitExtent([[65,35],[835,555]],feature);
  const path = d3.geoPath(projection);
  svg.append('path').datum(feature).attr('class','outline').attr('d',path);
  const symbols = svg.append('g');
  places.forEach((place, i) => {
    const point = projection([place.lon,place.lat]);
    if (!point || !Number.isFinite(point[0]) || !Number.isFinite(point[1])) return;
    const group=symbols.append('g').attr('transform',`translate(${point[0]},${point[1]})`);
    const star=group.append('path').attr('class','star').attr('d',d3.symbol().type(d3.symbolStar).size(115)()).attr('tabindex',0).attr('role','img').attr('aria-label',place.name);
    star.append('title').text(place.name);
    starNodes[i] = star.node();
    star.on('mouseenter', () => setActivePlace(i, true))
        .on('mouseleave', () => setActivePlace(i, false))
        .on('focus', () => setActivePlace(i, true))
        .on('blur', () => setActivePlace(i, false));
    if (place.url) { star.style('cursor','pointer').on('click',()=>window.open(place.url,'_blank','noopener,noreferrer')); }
    // Place name appears on hover via the star tooltip.
  });
  document.getElementById('mapStatus').textContent=places.length ? `${places.length} visited ${places.length===1?'place':'places'} · Hover over a star to see its name.` : 'Your map is ready. Add cities or places to the “places” list in this country’s HTML file.';
} catch(error) {
  document.getElementById('mapStatus').textContent='The map needs an internet connection to load. '+error.message;
}
</script></main><footer>© 2026 Andrey · Photography</footer><script src="../lightbox.js" defer></script></body></html>
