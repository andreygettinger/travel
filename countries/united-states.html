// Photo lists are generated automatically by GitHub Actions from photos/united-states/.
// No filenames need to be entered in this HTML file.
const gallery = document.getElementById('gallery');
async function loadGallery() {
  try {
    const response = await fetch('../galleries/united-states.json', {cache:'no-cache'});
    if (!response.ok) throw new Error('Photo list unavailable');
    const photos = await response.json();
    if (!Array.isArray(photos)) throw new Error('Invalid photo list');
    for (const filename of photos) {
      const img = document.createElement('img');
      img.src = '../photos/united-states/' + filename.split('/').map(encodeURIComponent).join('/');
      img.alt = 'United States — ' + filename;
      img.loading = 'lazy';
      const item = document.createElement('figure');
      item.className = 'photo-item';
      img.addEventListener('load', () => {
        const ratio = img.naturalWidth / img.naturalHeight;
        item.classList.remove('landscape', 'portrait', 'square');
        item.classList.add(ratio > 1.05 ? 'landscape' : ratio < 0.95 ? 'portrait' : 'square');
      });
      item.appendChild(img);
      gallery.appendChild(item);
    }
  } catch (error) {
    const note = document.createElement('p');
    note.textContent = 'Photos are temporarily unavailable. The gallery index may still be generating.';
    gallery.appendChild(note);
    console.warn('Gallery error:', error);
  }
}
loadGallery();

const placeList = document.getElementById('placeList');
const placeLinks = places.map((place, i) => {
  const a = document.createElement('a');
  a.className = 'place-link';
  a.href = place.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.lat + ',' + place.lon)}`;
  a.target = '_blank'; a.rel = 'noopener noreferrer';
  const dot = document.createElement('span'); dot.className = 'place-dot';
  const label = document.createElement('span'); label.textContent = place.name;
  a.append(dot, label); placeList.appendChild(a);
  a.addEventListener('mouseenter', () => setActivePlace(i, true));
  a.addEventListener('mouseleave', () => setActivePlace(i, false));
  a.addEventListener('focus', () => setActivePlace(i, true));
  a.addEventListener('blur', () => setActivePlace(i, false));
  return a;
});
const starNodes = [];
function setActivePlace(i, on) {
  if (starNodes[i]) starNodes[i].classList.toggle('is-active', on);
  if (placeLinks[i]) placeLinks[i].classList.toggle('is-active', on);
}
if (!places.length) document.querySelector('.place-panel').style.display = 'none';
const svg = d3.select('#countryMap');
try {
  // US Atlas contains state borders. Only the 48 contiguous states are shown.
  const response = await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json');
  if (!response.ok) throw new Error('Could not load US state map');
  const atlas = await response.json();
  const states = atlas.objects.states.geometries.filter(g => !['02','15','11','60','66','69','72','78'].includes(String(g.id).padStart(2,'0')));
  const features = states.map(g => topojson.feature(atlas,g));
  const mainland = topojson.merge(atlas,states);
  const projection = d3.geoAlbersUsa().fitExtent([[45,35],[855,555]],mainland);
  const path = d3.geoPath(projection);
  svg.append('path').datum(mainland).attr('class','outline').attr('d',path);
  svg.append('g').selectAll('path').data(features).join('path')
    .attr('d',path).attr('fill','none').attr('stroke','#395343')
    .attr('stroke-width',0.8).attr('stroke-opacity',0.75)
    .attr('vector-effect','non-scaling-stroke');
  const symbols = svg.append('g');
  places.forEach((place, i) => {
    const point = projection([place.lon,place.lat]);
    if (!point || !Number.isFinite(point[0]) || !Number.isFinite(point[1])) return;
    const group=symbols.append('g').attr('transform',`translate(${point[0]},${point[1]})`);
    const star=group.append('path').attr('class','star').attr('d',d3.symbol().type(d3.symbolStar).size(115)()).attr('tabindex',0).attr('role','img').attr('aria-label',place.name);
    star.append('title').text(place.name);
    starNodes[i] = star.node();
    star.on('mouseenter', () => setActivePlace(i, true))
        .on('mouseleave', () => setActivePlace(i, false))
        .on('focus', () => setActivePlace(i, true))
        .on('blur', () => setActivePlace(i, false));
    if (place.url) { star.style('cursor','pointer').on('click',()=>window.open(place.url,'_blank','noopener,noreferrer')); }
    // Place name appears on hover via the star tooltip.
  });
  document.getElementById('mapStatus').textContent=places.length ? `${places.length} visited ${places.length===1?'place':'places'} · Hover over a star to see its name.` : 'Your map is ready. Add cities or places to the “places” list in this country’s HTML file.';
} catch(error) {
  document.getElementById('mapStatus').textContent='The map needs an internet connection to load. '+error.message;
}
