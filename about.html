<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>About Me — Andrey Photography</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f3ef,#11110f);--surface:light-dark(#fff,#191816);--text:light-dark(#181714,#f4f1eb);--muted:light-dark(#706d67,#aaa59d);--line:light-dark(#dedad3,#302e2a);--accent:light-dark(#27352c,#c9d6cb)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{color:inherit}
.nav{height:clamp(58px,7vh,90px);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,110px);border-bottom:1px solid var(--line)}
.brand{font:clamp(20px,1.4vw,28px) Georgia,serif;text-decoration:none}.back{font-size:12px;letter-spacing:.1em;text-decoration:none;color:var(--muted);text-transform:uppercase}.back:hover{color:var(--text)}
main{max-width:1450px;margin:0 auto;padding:clamp(35px,7vh,105px) clamp(20px,6vw,110px);display:grid;grid-template-columns:minmax(250px,.8fr) 1.2fr;align-items:center;gap:clamp(35px,8vw,140px)}
.portrait{width:min(100%,510px);aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--surface);overflow:hidden;display:grid;place-items:center;margin:auto;color:var(--muted);font:clamp(40px,9vw,110px) Georgia,serif}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 22px}
h1{font:400 clamp(56px,7vw,110px)/.95 Georgia,serif;letter-spacing:-.055em;margin:0 0 36px}
.copy{font-size:clamp(16px,1.15vw,19px);line-height:1.85;color:var(--muted);max-width:580px}.copy p{margin:0 0 20px}
footer{padding:24px clamp(20px,5vw,110px);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media(max-width:760px){main{grid-template-columns:1fr;gap:40px}.portrait{max-width:310px}h1{font-size:64px}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="index.html">Andrey</a><a class="back" href="index.html">← Back to world map</a></header>
<main>
<div class="portrait"><img src="images/about-page.jpg" alt="Portrait of Andrey" onerror="this.style.display='none'"></div>
<section><p class="eyebrow">The person behind the camera</p><h1>About Me.</h1><div class="copy"><p>Hi, I'm Andrey. Welcome to my photography journal.</p><p>This is a collection of places I've explored and moments I've wanted to remember.</p><p><!-- Edit this paragraph to tell visitors more about yourself, your travels, and what photography means to you. -->More about me coming soon.</p></div></section>
</main><footer>Andrey — Photography</footer>
</body></html>
